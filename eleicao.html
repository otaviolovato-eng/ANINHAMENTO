<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de eleição</title>
</head>
<body>
    <h1>"Digite sua idade por favor!:"</h1>
    <input type="text" id="idade">
    <button onclick="votar()">Ok</button>

    <script>
        function votar(){
            let idade = parseInt(document.getElementById("idade").value);

            if(idade<16){
                alert("Voce nao pode votar ainda!!");
            }
            else{
                 if(idade<18){
                    alert("Voce pode votar, mas seu voto é facultativo");
                 }
                 else{
                    if(idade>=65){
                    alert("Voce pode votar, mas seu voto é facultativo");
                 }
                 else{
                    alert("Seu voto é obrigatório");
                 }
            }
        }
    }
    </script>
   

</body>
</html>
