<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Comparação</title>
</head>
<body>

    <h1>Digite dois números:</h1>

    <input type="number" id="n1">
    <input type="number" id="n2">

    <button onclick="comparar()">Comparar</button>

    <script>
        function comparar(){

            let n1 = Number(document.getElementById("n1").value);
            let n2 = Number(document.getElementById("n2").value);

            if(n1 > n2){
                alert("O primeiro número é maior");
            }
            else{
                if(n1 < n2){
                    alert("O primeiro número é menor");
                }
                else{
                    alert("Os números são iguais");
                }
            }

        }
    </script>

</body>
</html>
